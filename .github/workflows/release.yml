# 发行流水线：推送 v* tag 触发 → 单测 → 构建 → 校验冻结指纹 → 发 GitHub Release。
#
# 签名已冻结（2026-11-05）：全项目只有一把 key（PKCS12 / RSA3072 / alias junkmaster），
# CI 不得另生成 key，只从 Secrets 还原本机同一份文件。
# 需要在仓库 Settings → Secrets and variables → Actions 配置 4 个 Repository secrets：
#   KEYSTORE_BASE64   = base64 -w0 junkmaster-release.jks
#   KEYSTORE_PASSWORD = 该 keystore 的口令
#   KEY_ALIAS         = junkmaster
#   KEY_PASSWORD      = 与 KEYSTORE_PASSWORD 相同（PKCS12 下 store/key 口令必须一致）
# 这 4 个值由本机 D:\AndroidDev\keystore\ 生成，说明见 docs/RELEASE.md。
#
# tag 命名即发布语义：
#   v1.0.5-rc1  → 含 "-" → 自动标记 Pre-release（预发布，供真机复测）
#   v1.0.5      → 不含 "-" → 正式 Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # R8 + Kotlin 在默认 2G 堆上偏紧，给到 3G；runner 本身 16G 内存足够
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库由 Windows 维护（git core.fileMode=false），gradlew 的可执行位在 checkout
      # 到 Linux runner 时会丢失，直接跑会报 "./gradlew: Permission denied"（exit 126）。
      # 显式补一次，不依赖仓库里记录的文件模式。
      - name: Ensure gradlew is executable
        run: chmod +x gradlew && ls -l gradlew

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 防御性步骤：仓库里的 gradle.properties 已不含代理设置，
      # 但万一有人本地提交了 systemProp 代理行，这里兜底删掉，避免 CI 连 127.0.0.1 超时。
      - name: Strip accidental local proxy settings
        run: sed -i '/^systemProp\.http/d;/^systemProp\.https/d' gradle.properties || true

      # tag 与源码版本必须一致，否则拒绝发版（防止打错 tag 导致 Release 与 APK 版本不符）
      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          # 用 sed 而非 grep -P：不依赖 GNU grep 的 PCRE 支持
          GRADLE_VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "tag=$TAG_VERSION  base=$BASE_VERSION  versionName=$GRADLE_VERSION"
          if [ "$BASE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::tag 版本($BASE_VERSION) 与 versionName($GRADLE_VERSION) 不一致，禁止发版"
            exit 1
          fi
          if ! grep -q "^## v${GRADLE_VERSION}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 v${GRADLE_VERSION} 小节，禁止发版"
            exit 1
          fi

      - name: Restore keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，请先按 docs/RELEASE.md 配置 4 个 Secrets"
            exit 1
          fi
          # 在网页上粘贴 base64 容易带进换行/空格，先清干净再解码
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$GITHUB_WORKSPACE/app/release.jks"
          echo "keystore restored: $(stat -c%s "$GITHUB_WORKSPACE/app/release.jks") bytes"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 网页上粘贴 Secret 常带进尾随换行/空格，甚至把整行说明一起复制进来。
          # Properties 的 value 不会自动裁掉尾随空白，带进来必然「password was incorrect」，
          # 所以在这里统一清洗：去掉 CR/LF、首尾空白、以及被一起复制进来的成对引号。
          sanitize() {
            printf '%s' "$1" | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }
          STORE_PW="$(sanitize "${KEYSTORE_PASSWORD:-}")"
          KEY_PW="$(sanitize "${KEY_PASSWORD:-}")"
          ALIAS="$(sanitize "${KEY_ALIAS:-}")"
          if [ -z "$STORE_PW" ] || [ -z "$KEY_PW" ] || [ -z "$ALIAS" ]; then
            echo "::error::KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS 有空值，请先在 Settings → Secrets 配置"
            exit 1
          fi
          # 用 printf 逐行写，避免 heredoc 把 YAML 缩进带进 properties 文件
          {
            printf 'storeFile=app/release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PW"
            printf 'keyAlias=%s\n' "$ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PW"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          echo "keystore.properties 已生成（4 行，无缩进）；口令长度 ${#STORE_PW}，alias 长度 ${#ALIAS}"

      # 口令错误原本要到 packageRelease 才炸（已跑近 2 分钟、且报错只说 password incorrect）。
      # 这里提前用 keytool 验一次，十几秒内给出可操作的原因。
      - name: Verify keystore password and alias
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/app/release.jks"
          PW=$(sed -n 's/^storePassword=//p' "$GITHUB_WORKSPACE/keystore.properties")
          ALIAS=$(sed -n 's/^keyAlias=//p' "$GITHUB_WORKSPACE/keystore.properties")
          echo "校验中：keystore $(stat -c%s "$KS") bytes，alias=$ALIAS，口令长度=${#PW}"
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD 或 KEY_ALIAS 不正确（当前口令长度=${#PW}，正确口令为 48 个字符；alias 应为 junkmaster）"
            echo "常见原因："
            echo "  1) 复制成了 PASSWORDS.txt 的整行文字，而不是那一行里冒号之后的口令；"
            echo "  2) 值末尾带了换行 / 空格（本步骤已自动清洗，若仍失败说明值本身不对）；"
            echo "  3) KEYSTORE_PASSWORD 与 KEY_PASSWORD 填的不是同一个值（PKCS12 下两者必须相同）。"
            echo "请改用 delivery/KEYSTORE_PASSWORD.txt 里的单行内容（48 个字符）重新设置这两个 Secret。"
            exit 1
          fi
          echo "OK：keystore 口令与 alias 校验通过"
          # 证书指纹是公开信息，打出来便于确认还原的确实是被冻结的那把 key
          keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass "$PW" \
            | awk '/SHA256:/{print "keystore cert SHA-256: " $2; exit}'

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature (v2 and frozen certificate)
        env:
          # docs/ENV.md 记录的冻结证书 SHA-256（去冒号、小写）。指纹非机密。
          EXPECTED_FINGERPRINT: 'aaa47474e78934d2bf52bff6ecd5aabef55566b56b7990a981025d6c9b31557e'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk '/certificate SHA-256 digest/{gsub(/:/,"",$NF); print tolower($NF); exit}')
          echo "signer certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_FINGERPRINT" || {
            echo "::error::CI 证书与冻结 key 不一致，禁止发版"; exit 1;
          }
          cp "$APK" "JunkMaster-${GITHUB_REF_NAME}.apk"

      - name: Verify no INTERNET permission
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          if "$AAPT2" dump permissions "JunkMaster-${GITHUB_REF_NAME}.apk" | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK 中出现 INTERNET 权限，违反硬约束"; exit 1;
          fi
          echo "OK：无 INTERNET 权限"

      - name: Compute SHA-256
        run: sha256sum "JunkMaster-${GITHUB_REF_NAME}.apk" > "JunkMaster-${GITHUB_REF_NAME}.apk.sha256"

      # Release 说明只取 CHANGELOG 最新一节（整篇 40KB 太长），再拼上安装说明与校验信息
      - name: Prepare release notes
        env:
          EXPECTED_FINGERPRINT: 'aaa47474e78934d2bf52bff6ecd5aabef55566b56b7990a981025d6c9b31557e'
        run: |
          set -euo pipefail
          # 只取 CHANGELOG 第一个 "## v" 小节（到下一个 "## v" 之前），不含文件头部说明
          awk '/^## v/{n++; if (n==2) exit} n==1' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "## ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          {
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo
            echo "### 安装"
            echo
            echo "- 直接侧载安装，覆盖旧版无需卸载（同一把冻结证书，\`versionCode\` 递增即可升级）。"
            echo "- 需要 **Android 8.0+**（minSdk 26）；目标 SDK 36，已适配 Android 16。"
            echo "- 深度清理需安装并授权 [Shizuku](https://shizuku.rikka.app/)；不装也能用基础清理。"
            echo "- APK 无 \`INTERNET\` 权限，全程不联网。"
            echo
            echo "### 校验"
            echo
            echo '```text'
            cat "JunkMaster-${GITHUB_REF_NAME}.apk.sha256"
            echo "签名证书 SHA-256: $EXPECTED_FINGERPRINT"
            echo '```'
          } > RELEASE_NOTES.full.md
          mv RELEASE_NOTES.full.md RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # tag 含 "-" 即预发布（如 v1.0.5-rc1），不含则正式发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            JunkMaster-${{ github.ref_name }}.apk
            JunkMaster-${{ github.ref_name }}.apk.sha256
